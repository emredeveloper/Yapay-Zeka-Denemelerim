<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Qwen3-VL Bellek Ajanı - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.online {
            background: #10b981;
            color: white;
        }

        .status-badge.offline {
            background: #ef4444;
            color: white;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .panel-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #dbeafe;
            border-left: 4px solid #667eea;
            text-align: right;
        }

        .message.assistant {
            background: #dcfce7;
            border-left: 4px solid #10b981;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .logs-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .logs {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #1f2937;
            color: #e5e7eb;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 6px;
            padding: 4px;
            border-left: 3px solid;
            padding-left: 8px;
        }

        .log-entry.info {
            border-left-color: #3b82f6;
            color: #93c5fd;
        }

        .log-entry.processing {
            border-left-color: #f59e0b;
            color: #fcd34d;
        }

        .log-entry.success {
            border-left-color: #10b981;
            color: #a7f3d0;
        }

        .log-entry.error {
            border-left-color: #ef4444;
            color: #fca5a5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
        }

        .memory-box {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .memory-box h4 {
            color: #0369a1;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .memory-detail {
            font-size: 12px;
            color: #0c4a6e;
            margin-bottom: 5px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .controls button {
            flex: 1;
            font-size: 12px;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f4f6;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ef4444;
            margin-bottom: 15px;
        }

        .success-message {
            background: #dcfce7;
            color: #15803d;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">🤖 Qwen3-VL Bellek Ajanı</div>
            <div id="status-container">
                <span class="status-badge offline">Yükleniyor...</span>
            </div>
        </header>

        <div class="main-grid">
            <!-- Chat Paneli -->
            <div class="panel">
                <div class="panel-header">💬 Sohbet</div>
                <div class="chat-container">
                    <div class="messages" id="messages"></div>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="message-input" 
                            placeholder="Sorunuzu yazın..." 
                            onkeypress="handleKeyPress(event)"
                        >
                        <button onclick="sendMessage()">Gönder</button>
                    </div>
                </div>
            </div>

            <!-- Loglar Paneli -->
            <div class="panel">
                <div class="panel-header">📋 İşlem Logları</div>
                <div class="logs-container">
                    <div class="logs" id="logs">
                        <div class="log-entry info">Sistem başlatılıyor...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <!-- Bellek Durumu -->
            <div class="panel">
                <div class="panel-header">💾 Bellek Durumu</div>
                <div id="memory-status">
                    <div class="stat-box" style="margin-bottom: 10px;">
                        <h3>Yükleniyor...</h3>
                        <div class="loading"></div>
                    </div>
                </div>
                <div class="controls">
                    <button onclick="refreshMemory()" style="flex: 1;">🔄 Yenile</button>
                    <button class="danger" onclick="clearMemory()" style="flex: 1;">🗑️ Temizle</button>
                </div>
            </div>

            <!-- Analitikler -->
            <div class="panel">
                <div class="panel-header">📊 Analitikler</div>
                <div class="stats-grid" id="analytics"></div>
                <div style="margin-top: 15px;">
                    <button onclick="refreshAnalytics()" style="width: 100%;">📈 Güncelle</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                const statusBadge = document.getElementById('status-container');
                if (data.status === 'online') {
                    statusBadge.innerHTML = '<span class="status-badge online">🟢 Çevrimiçi</span>';
                } else {
                    statusBadge.innerHTML = '<span class="status-badge offline">🔴 Çevrimdışı</span>';
                }
                
                return data.status === 'online';
            } catch (error) {
                console.error('Status check error:', error);
                return false;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Kullanıcı mesajını göster
            addMessage(message, 'user');
            input.value = '';
            
            // Loading indicator
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<span class="loading"></span> Yanıt üretiliyor...';
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadingDiv.remove();
                    addMessage(data.response, 'assistant');
                    displayLogs(data.logs);
                    updateMemoryStatus(data.memory_state);
                } else {
                    loadingDiv.innerHTML = '❌ Hata: ' + (data.error || 'Bilinmeyen hata');
                }
            } catch (error) {
                loadingDiv.innerHTML = '❌ Bağlantı Hatası: ' + error.message;
            }
        }

        function addMessage(text, role) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function displayLogs(logs) {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = '';
            
            logs.forEach(log => {
                const entry = document.createElement('div');
                entry.className = `log-entry ${log.status}`;
                const time = new Date(log.timestamp).toLocaleTimeString();
                entry.textContent = `[${time}] [${log.step}] ${log.message}`;
                logsDiv.appendChild(entry);
            });
            
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateMemoryStatus(memoryState) {
            const statusDiv = document.getElementById('memory-status');
            const stm = memoryState.stm;
            const ltm = memoryState.ltm;
            
            statusDiv.innerHTML = `
                <div class="memory-box">
                    <h4>📝 Kısa Vadeli Bellek (STM)</h4>
                    <div class="memory-detail">Mesaj Sayısı: <strong>${stm.message_count}</strong></div>
                    <div class="memory-detail">Bellek Kullanımı: <strong>${(stm.size_estimate / 1024).toFixed(2)} KB</strong> / ${(stm.limit / 1024).toFixed(2)} KB</div>
                    <div style="background: #e0f2fe; height: 4px; border-radius: 2px; margin-top: 8px;">
                        <div style="background: #0ea5e9; height: 100%; border-radius: 2px; width: ${(stm.size_estimate / stm.limit * 100)}%;"></div>
                    </div>
                </div>
                <div class="memory-box">
                    <h4>🗂️ Uzun Vadeli Bellek (LTM)</h4>
                    <div class="memory-detail">Doküman Sayısı: <strong>${ltm.document_count}</strong></div>
                    <div class="memory-detail">Embedding Modeli: <strong>all-MiniLM-L6-v2</strong></div>
                </div>
                <div class="memory-box">
                    <h4>📊 Epizodik Log</h4>
                    <div class="memory-detail">Toplam Sohbet: <strong>${memoryState.episodic_count}</strong></div>
                </div>
            `;
        }

        async function refreshMemory() {
            try {
                const response = await fetch(`${API_BASE}/memory/view`);
                const data = await response.json();
                
                const statusDiv = document.getElementById('memory-status');
                statusDiv.innerHTML = `
                    <div class="memory-box">
                        <h4>📝 Kısa Vadeli Bellek</h4>
                        <div class="memory-detail">Mesajlar: <strong>${data.short_term.message_count}</strong></div>
                    </div>
                    <div class="memory-box">
                        <h4>🗂️ Uzun Vadeli Bellek</h4>
                        <div class="memory-detail">Dokümanlar: <strong>${data.long_term.document_count}</strong></div>
                    </div>
                `;
            } catch (error) {
                console.error('Memory refresh error:', error);
            }
        }

        async function clearMemory() {
            if (!confirm('Belleği temizlemek istediğinizden emin misiniz?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/memory/clear`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('messages').innerHTML = '';
                    addMessage('✅ Bellek temizlendi', 'assistant');
                    refreshMemory();
                }
            } catch (error) {
                console.error('Clear memory error:', error);
            }
        }

        async function refreshAnalytics() {
            try {
                const response = await fetch(`${API_BASE}/analytics`);
                const data = await response.json();
                const stats = data.stats;
                
                document.getElementById('analytics').innerHTML = `
                    <div class="stat-box">
                        <h3>Toplam Mesaj</h3>
                        <div class="value">${stats.total_messages}</div>
                    </div>
                    <div class="stat-box">
                        <h3>Başarılı</h3>
                        <div class="value">${stats.success_count}</div>
                    </div>
                    <div class="stat-box">
                        <h3>Hata</h3>
                        <div class="value">${stats.error_count}</div>
                    </div>
                    <div class="stat-box">
                        <h3>Ort. Cevap</h3>
                        <div class="value">${stats.avg_response_length}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Analytics error:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Sayfa yüklendiğinde
        window.addEventListener('load', async () => {
            const isOnline = await checkStatus();
            if (isOnline) {
                refreshMemory();
                refreshAnalytics();
            }
            
            // Her 5 saniyede status kontrol et
            setInterval(checkStatus, 5000);
        });
    </script>
</body>
</html>
